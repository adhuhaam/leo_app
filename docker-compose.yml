# Local Postgres for development. Production uses Supabase.
services:
  postgres:
    image: postgres:16-alpine
    container_name: leo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: leo_dev
      POSTGRES_DB: leo
    volumes:
      - leo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leo -d leo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  leo_pg_data:
